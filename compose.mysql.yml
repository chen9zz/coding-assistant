name: forgepilot-mysql-demo
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: forgepilot_test
      MYSQL_USER: forgepilot
      MYSQL_PASSWORD: ${FORGEPILOT_TEST_MYSQL_PASSWORD:?Set a disposable test password}
      MYSQL_ROOT_PASSWORD: ${FORGEPILOT_TEST_MYSQL_ROOT_PASSWORD:?Set a different root password}
    ports:
      - "127.0.0.1:${FORGEPILOT_TEST_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
volumes:
  mysql-data:
